<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Three Particles — a colorful 3D particle world</title>
  <desc id="description">An animated, glowing particle sphere floating above a dark teal background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081317"/>
      <stop offset=".58" stop-color="#0B1C20"/>
      <stop offset="1" stop-color="#11182D"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#28C8CA" stop-opacity=".2"/>
      <stop offset="1" stop-color="#28C8CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="matrix(92 95 -96 93 879 177)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F9FFFD"/>
      <stop offset=".16" stop-color="#53F0D1"/>
      <stop offset=".49" stop-color="#3588F3"/>
      <stop offset=".76" stop-color="#9653EA"/>
      <stop offset="1" stop-color="#EF4AA6"/>
    </radialGradient>
    <linearGradient id="label" x1="92" y1="0" x2="470" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70F3D0"/>
      <stop offset="1" stop-color="#8CA5FF"/>
    </linearGradient>
    <filter id="softGlow" x="735" y="52" width="300" height="300" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shadow" x="780" y="256" width="240" height="82" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .orb { transform-box: fill-box; transform-origin: center; animation: float 5s ease-in-out infinite; }
      .orbit { transform-origin: 879px 198px; animation: spin 24s linear infinite; }
      .spark { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      .spark:nth-of-type(2n) { animation-delay: -1.4s; }
      @keyframes float { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.35); } }
      @media (prefers-reduced-motion: reduce) { .orb, .orbit, .spark { animation: none; } }
    </style>
  </defs>
  <path fill="url(#background)" d="M0 0h1200v440H0z"/>
  <circle cx="885" cy="208" r="214" fill="url(#glow)"/>
  <path d="M64 1v438M1136 1v438" stroke="#D3FFFF" stroke-opacity=".06"/>
  <path d="M0 366c212-68 335-45 500-13 185 36 378 62 700-29v116H0V366Z" fill="#061014" fill-opacity=".4"/>
  <text x="88" y="126" fill="#A0B4B5" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="4">A REAL-TIME WEBGL EXPERIMENT</text>
  <text x="82" y="213" fill="#F4F8F7" font-family="Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-2">THREE</text>
  <text x="82" y="279" fill="url(#label)" font-family="Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-2">PARTICLES</text>
  <path d="M90 310h56" stroke="#68E8CC" stroke-width="3" stroke-linecap="round"/>
  <text x="90" y="344" fill="#9AABAD" font-family="Arial,sans-serif" font-size="16" letter-spacing=".5">A little universe, built one particle at a time.</text>
  <text x="90" y="391" fill="#687D80" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">GPU SIMULATION  ·  CUSTOM GLSL  ·  MOTION</text>
  <ellipse cx="881" cy="296" rx="117" ry="25" fill="#000" fill-opacity=".56" filter="url(#shadow)"/>
  <g class="orbit">
    <ellipse cx="879" cy="198" rx="158" ry="52" stroke="#66EFDA" stroke-opacity=".42" stroke-width="1.5" transform="rotate(-24 879 198)"/>
    <circle class="spark" cx="1020" cy="136" r="5" fill="#C5FFF3"/>
  </g>
  <g class="orb">
    <circle cx="879" cy="198" r="90" fill="#48D8E9" fill-opacity=".24" filter="url(#softGlow)"/>
    <circle cx="879" cy="198" r="77" fill="url(#orb)"/>
    <ellipse cx="850" cy="165" rx="30" ry="17" fill="#FFF" fill-opacity=".28" transform="rotate(-39 850 165)"/>
    <path d="M814 223c36 34 92 44 135 12" stroke="#FFF" stroke-opacity=".27" stroke-width="2"/>
    <path d="M822 145c23-27 63-38 94-27" stroke="#FFF" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g fill="#B5FFF3">
    <circle class="spark" cx="739" cy="137" r="3"/>
    <circle class="spark" cx="1019" cy="245" r="3.5"/>
    <circle class="spark" cx="966" cy="86" r="2.5"/>
    <circle class="spark" cx="754" cy="277" r="2"/>
    <circle class="spark" cx="1070" cy="184" r="2"/>
  </g>
  <g fill="#A9A1FF">
    <circle class="spark" cx="1003" cy="105" r="2"/>
    <circle class="spark" cx="768" cy="103" r="2.5"/>
    <circle class="spark" cx="1052" cy="294" r="2.5"/>
  </g>
  <text x="1100" y="408" fill="#6C8588" font-family="Arial,sans-serif" font-size="11" text-anchor="end" letter-spacing="2">MADE BY KAMLESH SINGH KOTWAL</text>
</svg>
